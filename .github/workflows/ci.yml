name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Generates the Prisma client's TypeScript types that the backend
      # imports from @prisma/client — only needs the schema file, not a
      # live database, so no DATABASE_URL is required here.
      - run: npx prisma generate
      - run: npm run typecheck

  mobile:
    name: Mobile typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
